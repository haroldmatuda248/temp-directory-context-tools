[project]
name = "temp-directory-context-tools"
version = "0.1.3"
description = "Context manager for running code inside a temporary directory and returning to the previous directory afterward"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
